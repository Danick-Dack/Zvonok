plugins {
    id 'com.android.application'
}

android {
    namespace 'app.urok7b'
    compileSdk 34

    defaultConfig {
        applicationId "app.urok7b"
        minSdk 26
        targetSdk 34
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "4").toInteger()) // = номер сборки, для проверки обновлений
        versionName "5.0-beta" // -dev: сборка в рабочей ветке, релиз не выходит; -beta: пробный выпуск
    }

    // Постоянный ключ (из секретов GitHub): каждая новая сборка ставится поверх старой.
    // Если ключа нет, сборка подписывается debug-ключом.
    def ks = file('zvonok.jks')
    signingConfigs {
        release {
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'uroki7b' // имя ключа внутри keystore, менять нельзя: иначе обновления не встанут поверх
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // R8 ужимает и оптимизирует код: APK меньше, работает быстрее
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig ks.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
    }

    // юнит-тесты на обычной JVM: настоящий org.json вместо заглушек android.jar
    testOptions {
        unitTests.returnDefaultValues = true
    }

    // Общий файл расписания всех классов (его же использует сайт)
    sourceSets {
        main.assets.srcDirs += ['../data']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}

dependencies {
    // только для тестов, в APK не попадают
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
