plugins {
    id 'com.android.application'
}

android {
    namespace 'app.urok7b'
    compileSdk 34

    defaultConfig {
        applicationId "app.urok7b"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "3.0"
    }

    // Постоянный ключ (из секретов GitHub): каждая новая сборка ставится поверх старой.
    // Если ключа нет, сборка подписывается debug-ключом.
    def ks = file('uroki7b.jks')
    signingConfigs {
        release {
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'uroki7b'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // R8 ужимает и оптимизирует код: APK меньше, работает быстрее
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig ks.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
    }

    // Общий файл расписания всех классов (его же использует сайт)
    sourceSets {
        main.assets.srcDirs += ['../data']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}
