<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="@CSP@">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F4F1" data-c="#F4F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0C" data-c="#0B0B0C" media="(prefers-color-scheme: dark)">
<title>Написать нам · Звонок</title>
<meta name="description" content="Идея, ошибка в расписании или вопрос про «Звонок». Анонимно, без аккаунта.">
<link rel="canonical" href="@SITE_URL@feedback.html">
<link rel="icon" href="@FAVICON@">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script>@HEAD_JS@</script>
<style>@CSS@</style>
</head>
<body class="has-tabbar">
<a class="skip" href="#main">К форме</a>
@ICONS@
@HEADER@
<main id="main" class="wrap narrow page" tabindex="-1">
  <div class="page-head"><h1>Написать нам</h1><p>Идея, ошибка в расписании или просто спасибо. Читаем всё.</p></div>
  <div class="promise"><svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg><div><b id="pTitle">Анонимно</b><p>Имя и телефон не приходят, только твой текст. Письмо уходит через сервис отправки Web3Forms, поэтому не пиши в нём личного.</p></div></div>
  <form class="form" id="form" novalidate>
    <div><span class="label" id="kindL">Что это</span><div class="seg" id="kind" role="group" aria-labelledby="kindL"></div></div>
    <div>
      <label class="label" for="text">Сообщение</label>
      <textarea class="field" id="text" maxlength="1000" rows="6" placeholder="Идея, ошибка или вопрос" required></textarea>
      <div class="count" id="cnt" aria-live="off">0 / 1000</div>
    </div>
    <div><label class="label" for="cls">Класс, если хочешь</label><select class="field" id="cls"></select></div>
    <div class="hp" aria-hidden="true"><label for="site">Сайт</label><input id="site" name="site" tabindex="-1" autocomplete="off"></div>
    <button class="btn btn-primary btn-wide" id="send" type="submit" disabled>Отправить</button>
    <p class="err" id="err" role="alert" hidden></p>
  </form>
  <div class="card sent" id="done" hidden tabindex="-1">
    <svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>
    <b>Спасибо, получили</b>
    <button class="btn btn-quiet" id="again" type="button">Написать ещё</button>
  </div>
</main>
@FOOTER@
<div class="zv-toast" id="zvToast" role="status" aria-live="polite"></div>
<script>@JS@</script>
</body>
</html>
