<!doctype html>

<pre id="out"></pre>
<script src="_sig_fixture.js"></script><!-- пишет tools/test_site.py: подписанная тестовым ключом «новая версия» 7Б -->
<script>
// Запуск: python tools/test_site.py (копии страниц без CSP, безголовый Chrome)
const out = [];
const ok = (cond, name) => out.push((cond ? "PASS " : "FAIL ") + name);
const run = (name, fn) => { try { fn(); } catch (e) { ok(false, name + ": " + e); } };
const at = iso => new Date(iso);
function load(src, w, h) {
  return new Promise(r => {
    const f = document.createElement("iframe"); f.src = src; f.style.cssText = "width:" + (w || 390) + "px;height:" + (h || 800) + "px";
    f.onload = () => setTimeout(() => r(f.contentWindow), 400); document.body.append(f);
  });
}
// контраст по WCAG: относительная яркость
function lum(c) {
  const m = c.match(/\d+(\.\d+)?/g).map(Number), f = v => { v /= 255; return v <= .04045 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); };
  return .2126 * f(m[0]) + .7152 * f(m[1]) + .0722 * f(m[2]);
}
const ratio = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };

// окно сайта могло загрузиться раньше, чем дошла очередь до этого скрипта (большой _sig_fixture.js): тогда сразу
const frameF = document.getElementById("f"), frameDoc = frameF.contentDocument;
if (frameDoc && frameDoc.readyState === "complete" && frameDoc.URL !== "about:blank") setTimeout(main, 500);
else frameF.onload = () => setTimeout(main, 500);
async function main() {
  const w = document.getElementById("f").contentWindow, d = w.document, ev = s => w.eval(s);
  // выполнить код сайта «как будто сейчас» T
  const withDate = (T, code) => ev(`(() => { const R = Date, T = ${JSON.stringify(T)};
      window.Date = class extends R { constructor(...a) { super(...(a.length ? a : [T])); } static now() { return new R(T).getTime(); } };
      try { return (${code}); } finally { window.Date = R; } })()`);
  ok(d.getElementById("lTitle").textContent !== "" || !d.getElementById("hello").hidden, "скрипт главной запустился");

  run("таймер 7Б", () => {
    ev('cls="7Б";useCustom=false;pick=false;rebuild()');
    const c = t => w.compute(at(t), ev("src"));
    let s = c("2026-11-02T08:20:00"); ok(s.kind === "LESSON" && s.cur.subject === "Классный час", "пн 8:20: классный час");
    s = c("2026-11-02T08:47:00"); ok(s.kind === "BREAK" && s.next.subject === "Казахский яз. и лит.", "пн 8:47: перемена, дальше казахский");
    s = c("2026-11-02T07:30:00"); ok(s.kind === "BEFORE" && s.soon, "пн 7:30: скоро уроки");
    s = c("2026-11-02T06:00:00"); ok(s.kind === "BEFORE" && !s.soon, "пн 6:00: без отсчёта");
    s = c("2026-11-02T15:24:00"); ok(s.kind === "LESSON" && s.cur.num === 8 && !s.next, "пн 15:24: последний урок");
    s = c("2026-11-02T16:00:00"); ok(s.kind === "AFTER" && s.nLabel === "Завтра" && s.next.subject === "Геометрия", "пн 16:00: завтра геометрия");
    s = c("2026-11-06T16:00:00"); ok(s.kind === "AFTER" && s.nLabel === "Понедельник", "пт 16:00: в понедельник");
    s = c("2026-11-07T12:00:00"); ok(s.kind === "OFF" && s.next.subject === "Классный час", "сб: выходной");
    ok(w.fmtTimer(3723000) === "1:02:03" && w.fmtTimer(59000) === "0:59", "формат таймера");
    ok(ev('[plural(1),plural(3),plural(7),plural(11),plural(22)].join()') === "1 урок,3 урока,7 уроков,11 уроков,22 урока", "склонение «урок»");
  });

  run("каникулы", () => {
    let s = w.compute(at("2026-12-30T10:00:00"), ev("src"));
    ok(s.kind === "OFF" && s.holiday && s.holiday[2] === "Зимние каникулы" && s.nLabel === "11 января", "30 декабря: каникулы, уроки с 11 января");
    s = w.compute(at("2026-12-25T16:00:00"), ev("src"));
    ok(s.kind === "AFTER" && s.nLabel === "11 января", "25 декабря после уроков: дальше 11 января");
    s = w.compute(at("2026-12-16T10:00:00"), ev("src"));
    ok(s.kind === "OFF" && s.holiday[2] === "День Независимости", "16 декабря: праздник");
    withDate("2026-12-30T10:00:00", 'key="",tick()');
    ok(d.getElementById("lTitle").textContent === "Каникулы" && d.getElementById("lTimer").textContent === "12" && /дней до уроков/.test(d.getElementById("lCap").textContent), "карточка в каникулы: дни до уроков");
  });

  run("замены", () => {
    ev(`CHANGES={days:{
      "2026-11-03":{note:"Сокращённые уроки",bells:[["8:00","8:30"],["8:35","9:05"],["9:15","9:45"],["9:55","10:25"],["10:35","11:05"],["11:15","11:45"],["11:50","12:20"]],
        classes:{"7Б":{"1":{subject:"fiz",room:"48"},"2":"нет урока","8":{subject:"Шахматы",room:"40"}}}},
      "2026-11-04":{off:"Актированный день"}}};chVer++`);
    const l = w.dayLessons("7Б", at("2026-11-03T12:00:00"));
    ok(l[0].subject === "Физика" && l[0].room === "48" && l[0].changed && l[0].end === 510, "замена 1 урока и сокращённый звонок");
    ok(!l.some(x => x.num === 2), "2 урок отменён");
    ok(l[1].subject === "Физика" && !l[1].changed && l[1].short && l[1].start === 555, "остальные уроки по сокращённым звонкам");
    ok(!l.some(x => x.num === 8), "лишний урок без звонка не появляется");
    let s = w.compute(at("2026-11-03T08:20:00"), ev("src"));
    ok(s.kind === "LESSON" && s.cur.subject === "Физика" && s.target === at("2026-11-03T08:30:00").getTime(), "таймер идёт по замене");
    s = w.compute(at("2026-11-04T09:00:00"), ev("src"));
    ok(s.kind === "OFF" && s.holiday[2] === "Актированный день", "день off: уроков нет");
    const a = w.dayLessons("7А", at("2026-11-03T12:00:00"))[0];
    ok(a.subject === "Физика" && !a.changed && a.end === 510, "у другого класса только сокращённые звонки");
    withDate("2026-11-03T08:20:00", 'key="",tick()');
    ok(d.getElementById("lTag").textContent === "замена" && !d.getElementById("lTag").hidden, "пометка «замена» в карточке");
    const note = d.getElementById("todayNote");
    ok(note.textContent.includes("Сокращённые уроки") && note.textContent.includes("Отменён урок 2") && note.classList.contains("bad"), "пометка дня: заметка и отмена красным");
    ok(d.querySelector("#todayList .les .chg").textContent === "замена", "пометка «замена» в ленте дня");
    ev('CHANGES={days:{}};chVer++;key=""');
  });

  run("счётчик до каникул", () => {
    const v = t => w.vacation(at(t), ev("src"));
    ok(v("2026-12-21T07:00:00").n === 5 && v("2026-12-21T07:00:00").name === "Зимние каникулы", "21 декабря утром: 5 учебных дней");
    ok(v("2026-12-21T17:00:00").n === 4, "после уроков сегодня не считается");
    ok(w.vacationText(v("2026-12-25T09:00:00")).startsWith("Сегодня последний учебный день"), "последний день");
    ok(w.vacationText(v("2026-12-14T09:00:00")) === "До каникул 9 учебных дней", "праздник 16 декабря не считается");
    ok(v("2026-12-30T09:00:00") === null, "в каникулы счётчика нет");
    ok(ev('[1,3,18].map(n => vacationText({n, today: false, name: "Зимние каникулы"})).join()') === "До каникул 1 учебный день,До каникул 3 учебных дня,До каникул 18 учебных дней", "склонение дней");
  });

  run("СОР и СОЧ", () => {
    ev('cls="7Б";useCustom=false;pick=false;rebuild()');
    const on = t => w.examsOn("7Б", at(t)).map(x => x.type + " " + x.subject).join(), txt = sel => (d.querySelector(sel) || {}).textContent;
    ok(on("2026-11-13T09:00:00") === "СОР Казахский яз. и лит." && on("2026-12-22T09:00:00") === "СОЧ Английский язык,СОЧ Геометрия,СОЧ Физика" && on("2026-11-14T09:00:00") === "", "7Б: СОР 13 ноября, три СОЧ 22 декабря");
    ok(w.examText(w.examsOn("7Б", at("2026-12-18T09:00:00"))) === "СОЧ: казахский яз. и лит.. СОР: английский язык, информатика", "текст дня: сначала СОЧ, потом СОР");
    ok(w.examsEnd() === "2026-12-23" && w.examList("9В").length === 29, "последний день графика 23 декабря");
    const all = Object.keys(ev("DATA.classes")).flatMap(c => w.examList(c));
    ok(all.length > 400 && all.every(x => new Date(x.date + "T12:00:00").getDay() % 6 !== 0 && !w.holiday(new Date(x.date + "T12:00:00"))), "ни один СОР или СОЧ не выпал на выходной или праздник (" + all.length + ")");
    withDate("2026-12-21T07:00:00", 'examTab(),location.hash="#exams",route(false),renderExams()');
    ok(!d.getElementById("v-exams").hidden && !d.querySelector('.tabbar a[data-tab="exams"]').hidden && txt("#examList .exam-day.today .tag.soch") === "СОЧ", "вкладка СОР/СОЧ: сегодняшний СОЧ отмечен");
    [...d.querySelectorAll("#examClasses button")].find(b => b.textContent === "10А").click();
    ok(/^10А/.test(d.getElementById("examsMeta").textContent), "во вкладке можно посмотреть любой класс");
    withDate("2026-12-21T07:00:00", 'key="",tick()');
    ok(d.getElementById("todayExam").textContent === "Сегодня СОЧ: алгебра" && txt("#todayList .exm") === "СОЧ", "«Сейчас»: СОЧ в пометке дня и на уроке");
    withDate("2026-12-20T12:00:00", 'key="",tick()');
    ok(d.getElementById("todayExam").textContent === "Завтра СОЧ: алгебра", "накануне: «Завтра СОЧ»");
    withDate("2026-12-24T07:00:00", 'examTab(),route(false)');
    ok(d.querySelector('.tabbar a[data-tab="exams"]').hidden && d.querySelector('.nav-top a[data-tab="exams"]').hidden && d.getElementById("v-exams").hidden, "после последнего СОЧ вкладка исчезает сама");
    ev('location.hash="#now";examTab();key="";tick()');
  });

  run("кружки и ШОР", () => {
    ev('EXTRA={shor:["fiz7"],clubs:[{name:"Шахматы",place:"каб. 12",times:[[1,"17:00","18:00"]]}]}');
    const list = w.extrasOn(at("2026-11-17T09:00:00"), ev("EXTRA"));
    ok(list.map(x => x.name + " " + x.start + "-" + x.end).join() === "ШОР · Физика 870-990,Шахматы 1020-1080", "вторник: ШОР по физике и шахматы по времени");
    ok(w.extrasOn(at("2026-11-18T09:00:00"), ev("EXTRA")).length === 0 && w.extrasOn(at("2026-12-29T09:00:00"), ev("EXTRA")).length === 0, "в другой день и в каникулы занятий нет");
    let x = w.extraNow(at("2026-11-17T13:50:00"), ev("EXTRA"));
    ok(!x.on && w.extraText(x, at("2026-11-17T13:50:00")) === "ШОР · Физика: до начала 40 мин", "до начала ШОР 40 минут");
    x = w.extraNow(at("2026-11-17T15:25:00"), ev("EXTRA"));
    ok(x.on && w.extraText(x, at("2026-11-17T15:25:00")) === "ШОР · Физика: до конца 1 ч 5 мин", "идёт: до конца 1 ч 5 мин");
    ok(w.extraNow(at("2026-11-17T18:00:00"), ev("EXTRA")) === null, "после последнего занятия пусто");
    withDate("2026-11-17T15:25:00", 'key="",tick()');
    ok(!d.getElementById("extra").hidden && d.getElementById("extraText").textContent.startsWith("ШОР · Физика: до конца"), "карточка занятия на «Сейчас»");
    ev('location.hash="#week";route(false);renderWeek()');
    ok(d.querySelectorAll("#weekGrid .extras li").length >= 2, "кружки видны в неделе");
    ev('store.set("extras",{shor:["нет","fiz7",5],clubs:[{name:"<b>x</b>",times:[[9,"1","2"],[2,"10:00","9:00"],[3,"10:00","11:00"]]},{times:1}]})');
    const e = ev("extraSet()");
    ok(e.shor.join() === "нет,fiz7" && e.clubs.length === 1 && e.clubs[0].times.length === 1, "мусор в сохранённых кружках отбрасывается");
    ev('store.del("extras");EXTRA=extraSet();location.hash="#now";route(false);key="";tick()');
  });

  run("праздники", () => {
    ok(w.offSoon(at("2026-12-15T10:00:00"), ev("src")) === "Завтра День Независимости, в школу не идём", "накануне праздника: завтра в школу не идём");
    ok(w.offSoon(at("2027-03-12T10:00:00"), ev("src")) === "В понедельник День Конституции, в школу не идём", "в пятницу про праздник в понедельник");
    ok(w.offSoon(at("2026-12-25T10:00:00"), ev("src")) === "" && w.offSoon(at("2026-11-17T10:00:00"), ev("src")) === "", "про каникулы говорит счётчик, в обычный день пусто");
    const f = t => (w.festive(at(t)) || [])[4];
    ok(f("2026-10-31T10:00:00") === "Хэллоуин" && f("2026-12-31T10:00:00") === "Новый год" && f("2027-01-05T10:00:00") === "Новый год" && f("2026-12-16T10:00:00") === "День Независимости" && f("2026-11-17T10:00:00") === undefined, "праздничные темы по датам, Новый год через границу года");
    withDate("2026-10-31T10:00:00", 'store.del("festSeen"),key="",tick()');
    ok(d.documentElement.hasAttribute("data-fest") && !d.getElementById("fest").hidden && d.getElementById("festName").textContent === "Хэллоуин", "праздничная тема включается сама");
    withDate("2026-10-31T10:00:00", 'store.set("fest",false),key="",tick()');
    ok(!d.documentElement.hasAttribute("data-fest") && d.getElementById("fest").hidden, "и выключается в «Оформлении»");
    ev('store.del("fest");key="";tick()');
  });

  run("новости", () => {
    const items = w.cleanFeed({items: [{id: 7, date: "2026-11-06T09:45:54+00:00", text: "Привет https://example.com/a. <b>x</b>", photo: "news/7.jpg", pics: 2},
      {id: 1000000009, date: "2026-11-07T09:00:00Z", text: "своё", own: true}, {id: "5", date: "x"}, null]});
    ok(items.length === 2 && items[0].own && items[1].pics === 2 && !("photo" in items[1]), "из news.json берётся только понятное, свежие сверху, фото не грузятся");
    ev('FEED=cleanFeed({items:[{id:7,date:"2026-11-06T09:45:54+00:00",text:"Привет https://example.com/a. <b>x</b>",pics:2},{id:1000000009,date:"2026-11-05T09:00:00Z",text:"своё",own:true}]});store.del("newsAt");newsDot()');
    ok(d.querySelector('.tabbar a[data-tab="news"]').classList.contains("dot"), "новый пост: точка на вкладке");
    ev('location.hash="#news";route(false)');
    const post = d.querySelector("#feed .post");
    ok(!!post && post.querySelector(".post-text a").getAttribute("href") === "https://example.com/a" && !post.querySelector(".post-text b") && post.textContent.includes("<b>x</b>")
      && !post.querySelector("img") && post.textContent.includes("2 фото в Telegram"), "пост: ссылка кликается, HTML из канала остаётся текстом, фото только по ссылке");
    const own = d.querySelector("#feed .post.own");
    ok(!!own && !own.querySelector('a[href*="t.me"]'), "своё объявление без ссылки на Telegram");
    ok(!d.querySelector('.tabbar a[data-tab="news"]').classList.contains("dot") && ev('store.get("newsAt",0)') === Date.parse("2026-11-06T09:45:54+00:00"), "после открытия точка пропадает");
    ev('location.hash="#now";route(false)');
  });

  run("для учителей и змейка", () => {
    ev('location.hash="#rooms";route(false)');
    ok(d.getElementById("tWhat").options.length > 10 && d.querySelectorAll("#tWeek h3").length === 5, "неделя кабинета: пять учебных дней");
    ev('$("tMode").value="subj";renderTeach()');
    ok(d.querySelectorAll("#tWeek .slot-row").length > 0 && !/undefined|NaN/.test(d.getElementById("tWeek").textContent), "уроки предмета у всех классов");
    ev('$("tMode").value="room";renderTeach();location.hash="#now";route(false)');
    ok(["up", "lt", "rt", "dn"].every(c => d.querySelector("#game .pad ." + c)), "змейка: крестовина из четырёх кнопок");
  });

  run("ссылка на класс и вкладки", () => {
    ev('location.hash="#10a"');
    ok(ev("classFromHash()") === "10А", "#10a это 10А");
    ev('location.hash="#9%D0%B3"');
    ok(ev("classFromHash()") === "9Г", "кириллица #9г");
    ev('location.hash="#week"');
    ok(ev("classFromHash()") === null, "вкладка не класс");
    ev('location.hash="#10a";route(false)');
    ok(ev("cls") === "10А" && ev("shareUrl()").endsWith("/#10a") && location.hash === "" || ev("cls") === "10А", "ссылка открывает класс");
    ok(ev("QRS[\"10А\"]") !== ev("QRS[\"\"]"), "у класса свой QR");
    ev('location.hash="#week";route(false)');
    ok(!d.getElementById("v-week").hidden && d.getElementById("v-now").hidden, "#week открывает неделю");
    ok(d.querySelector('.tabbar a[aria-current="page"]').dataset.tab === "week", "в нижней панели отмечена неделя");
    ev('location.hash="#install";route(false)');
    ok(!d.getElementById("v-get").hidden && !!d.querySelector("#v-get #install") && !d.querySelector("#v-more #install"), "старая ссылка #install ведёт во вкладку «Скачать на телефон», в «Ещё» её нет");
    ev('location.hash="#olymp";route(false)');
    ok(!d.getElementById("v-olymp").hidden && d.querySelector('.tabbar a[aria-current="page"]').dataset.tab === "more" && !!d.querySelector('#v-more a[href="#olymp"]'), "олимпиады открываются из «Ещё»");
    ok(d.querySelector(".brand").getAttribute("href") === "about", "логотип ведёт на /about");
    const tabs = [...d.querySelectorAll(".tabbar a")].map(a => a.dataset.tab).join();
    ok(tabs === "now,week,rooms,exams,news,more", "нижняя панель: «Новости» перед «Ещё» (" + tabs + ")");
    ev('location.hash="#schedule";route(false)');
    ok(!d.getElementById("v-week").hidden, "старая ссылка #schedule ведёт в неделю");
    ev('location.hash="#now";route(false);setClass("7Б")');
    ok(ev("cls") === "7Б" && JSON.parse(w.localStorage.getItem("zv.class")) === "7Б", "выбор класса запоминается");
  });

  run("«Ещё»: счётчик дней проекта", () => {
    ev('location.hash="#more";route(false);renderMore()');
    const age = d.getElementById("age"), n = ev("projectAge(new Date())");
    ok(!!age && /^«Звонку» \d+ (день|дня|дней)\. Первая версия вышла 1 ноября 2026\.$/.test(age.textContent) && age.textContent.includes(" " + n + " "),
      "в «О проекте» мини-счётчик: " + (age ? age.textContent : "нет #age"));
    ok(ev('projectAge(new Date(2026, 10, 1, 9))') === 1 && ev('projectAge(new Date(2026, 10, 5, 23))') === 4 && ev('projectAge(new Date(2027, 10, 1))') === 365,
      "счётчик: 1 ноября первый день, 5 ноября 4 дня, через год 365");
    const ageEl = d.getElementById("age"), parent = ageEl.parentNode, next = ageEl.nextSibling;
    ageEl.remove();
    let noAge = true;
    try { ev("renderMore()"); } catch (e) { noAge = false; }
    parent.insertBefore(ageEl, next);
    ok(noAge, "«Ещё» рисуется и без блока счётчика");
    ev('location.hash="#now";route(false)');
  });

  run("кабинеты", () => {
    const use = withDate("2026-11-02T10:00:00", "roomDay(new Date())");
    const t = w.roomNow("46", use, 600);
    ok(t.busy && /^Сейчас .+\. Освободится в \d+:\d\d$/.test(t.text), "занят: кто и когда освободится (" + t.text + ")");
    const f = w.roomNow("46", use, 16 * 60);

async function iosScript(w) {
  const SCR = (window.SIG_FIXTURE || {}).scripts || {}, src = SCR["7Б"], ver = w.eval("IOS_VERSIONS")["7B"];
  const run = async (opts, code) => {
    const files = Object.assign({}, opts.files || {}), logs = [], notes = [], reminders = [];
    let out = null;
    const fm = {documentsDirectory: () => "/docs", joinPath: (a, b) => a + "/" + b, fileExists: p => p in files, readString: p => files[p],
      writeString: (p, s) => { files[p] = s; }, modificationDate: () => new Date(), isFileStoredIniCloud: p => p.startsWith("/icloud/")};
    class Request { constructor(u) { this.url = u; logs.push(u); }
      loadJSON() { return /versions\.json$/.test(this.url) ? Promise.resolve(opts.versions) : /news\.json$/.test(this.url) && opts.news ? Promise.resolve(opts.news) : Promise.reject(new Error("офлайн")); }
      load() { return Promise.resolve(); }
      loadString() { return /ios\/7B\.js$/.test(this.url) ? Promise.resolve(opts.code) : Promise.reject(new Error("офлайн")); } }
    class Stub { constructor() { return new Proxy(function () {}, {get: (t, k) => k === "then" ? undefined : new Stub(), apply: () => new Stub(), construct: () => new Stub(), set: () => true}); } }
    const env = {config: {runsInApp: true, runsWithSiri: !!opts.siri, runsInWidget: false}, args: {widgetParameter: opts.param || ""}, module: {filename: "/icloud/Звонок.js"},
      Script: {complete() {}, setWidget() {}, setShortcutOutput(v) { out = v; }}, FileManager: {local: () => fm, iCloud: () => fm}, Request,
      Notification: class { setTriggerDate(d) { this.when = d; }
        schedule() { (/^zv-exam-/.test(this.identifier || "") ? reminders : notes).push(this.title + " / " + this.body); return Promise.resolve(); } },
      WebView: class { loadHTML() { return Promise.resolve(); } present() { return Promise.resolve(); } },
      Color: Stub, Font: Stub, Size: Stub, Point: Stub, LinearGradient: Stub, ListWidget: Stub, SFSymbol: Stub, DrawContext: Stub, Image: Stub, Path: Stub, Rect: Stub,
      Device: {isUsingDarkAppearance: () => true, screenSize: () => ({width: 390, height: 844})}};
    const names = Object.keys(env), AF = Object.getPrototypeOf(async function () {}).constructor;
    const ret = await new AF(...names, code || src)(...names.map(n => env[n]));
    return {files, logs, notes, reminders, out, ret};
  };
  try {
    // код темы в виджете: мусор на входе даёт тему по умолчанию, без исключений
    const pt = (await run({versions: {classes: {}}}, src.replace("Script.complete();", "Script.complete(); return parseTheme;"))).ret;
    // без своей темы цвет урока включён (4.0); в своём коде без sc=1 выключен, как было
    const DEF = JSON.stringify({bg: "000000", ac: "FFFFFF", p: 1, n: 1, d: 1, sc: 1, tx: ""}), DEF0 = DEF.replace('"sc":1', '"sc":0');
    let themeOk = [undefined, null, "", "abc", "ZV2;bg=112233", "ZV1;" + "x".repeat(300), 42, {}]
      .every(x => { try { return JSON.stringify(pt(x)) === DEF; } catch (e) { return false; } });
    try { themeOk = themeOk && JSON.stringify(pt("ZV1;bg=zzzzzz;sc=abc;p=2;n=;d=x;tx=GGGGGG;=;;")) === DEF0; } catch (e) { themeOk = false; }
    const good = pt("ZV1;bg=0b1220;ac=60A5FA;p=0;n=1;d=0;sc=1;tx=ffffff;zz=1");
    themeOk = themeOk && good.bg === "0B1220" && good.ac === "60A5FA" && good.p === 0 && good.d === 0 && good.sc === 1 && good.tx === "FFFFFF" && !("zz" in good);
    ok(themeOk, "код темы в виджете: мусор даёт тему по умолчанию, верный код читается целиком");
    // подпись новых версий: тестовый ключ из tools/test_site.py вместо настоящего
    const F = window.SIG_FIXTURE || {};
    const withKey = k => src.replace(/const UPDATE_KEY = "[^"]*";/, 'const UPDATE_KEY = "' + k + '";');
    const keyed = withKey(F.pub), plain = withKey(""), got = r => !!r.files["/icloud/Звонок.js"];
    const kit = (await run({versions: {classes: {}}}, keyed.replace("Script.complete();", "Script.complete(); return {sha512, utf8, edVerify, b64bytes};"))).ret;
    const hex = a => a.map(x => x.toString(16).padStart(2, "0")).join("");
    ok(hex(kit.sha512(kit.utf8("abc"))) === F.sha.abc && hex(kit.sha512(kit.utf8(F.code))) === F.sha.code,
      "SHA-512 виджета совпадает с Python: короткая строка и весь скрипт с кириллицей");
    const pubB = kit.b64bytes(F.pub), sigB = kit.b64bytes(F.sig), msgB = kit.utf8(F.code), flip = sigB.slice();
    flip[10] ^= 1;
    ok(kit.edVerify(pubB, msgB, sigB) && !kit.edVerify(pubB, kit.utf8(F.code + " "), sigB) && !kit.edVerify(pubB, msgB, flip),
      "Ed25519 виджета: верная подпись проходит, изменённый файл и изменённая подпись нет");
    if (F.real) ok(kit.edVerify(kit.b64bytes(F.real.pub), kit.utf8(F.real.code), kit.b64bytes(F.real.sig)), "подпись скрипта 7Б на сайте сходится с ключом внутри скрипта");
    let r = await run({versions: {note: "Новое", classes: {"7B": "new0000001"}, sig: {"7B": F.sig}}, code: F.code}, keyed);
    ok(got(r) && r.files["/icloud/Звонок.js"].includes('const VERSION = "new0000001"') && r.notes.length === 1 && r.notes[0].startsWith("Звонок обновился"),
      "виджет iPhone сам ставит подписанную новую версию и присылает уведомление");
    r = await run({versions: {classes: {"7B": "new0000001"}}, code: F.code}, keyed);
    ok(!got(r) && r.notes.length === 0, "версию без подписи не ставит");
    r = await run({versions: {classes: {"7B": "old0000001"}, sig: {"7B": F.old.sig}}, code: F.old.code}, keyed);
    ok(!got(r) && r.notes.length === 0, "старую подписанную версию поверх новой не ставит (откат)");
    r = await run({versions: {classes: {"7B": "new0000001"}, sig: {"7B": F.sig}}, code: F.code.replace("Script.complete();", "Script.complete(); /* подмена */")}, keyed);
    ok(!got(r) && r.notes.length === 0, "подменённый файл со старой подписью не ставит");
    r = await run({versions: {classes: {"7B": "new0000001"}}, code: F.code}, plain);
    ok(got(r), "без ключа в скрипте (сайт собран без секрета) обновляется как раньше");
    r = await run({versions: {classes: {"7B": "new0000001"}}, code: "alert(1)"}, plain);
    ok(!got(r) && r.notes.length === 0, "битую или чужую версию не ставит");
    r = await run({versions: {classes: {"7B": ver}}, code: F.code}, keyed);
    ok(!got(r) && !r.logs.some(u => /ios\/7B\.js/.test(u)), "та же версия: ничего не скачивает");
    r = await run({versions: {classes: {"7B": ver}}, news: {items: [{id: 5, date: "2026-11-06T09:00:00Z", text: "старый пост"}, {id: 1000000009, date: "2026-11-07T09:00:00Z", text: "Привет, лицей\nвторая строка", own: true}]},
      files: {"/docs/zvonok-update.json": JSON.stringify({newsAt: Date.parse("2026-11-06T09:00:00Z")})}});
    ok(r.notes.join() === "Новости лицея / Привет, лицей" && JSON.parse(r.files["/docs/zvonok-update.json"]).newsAt === Date.parse("2026-11-07T09:00:00Z"), "iPhone: уведомление о самом свежем посте по времени, один раз");
    r = await run({versions: {classes: {"7B": ver}}, news: {items: [{id: 5, date: "2026-11-06T09:00:00Z", text: "Привет"}]}});
    ok(r.notes.length === 0 && JSON.parse(r.files["/docs/zvonok-update.json"]).newsAt === Date.parse("2026-11-06T09:00:00Z"), "iPhone: при первом запуске старые новости не присылает");
    r = await run({versions: {classes: {"7B": ver}}, news: {items: [{id: 9, date: "2026-11-08T09:00:00Z", text: "x"}]}, files: {"/docs/zvonok-update.json": JSON.stringify({newsAt: 1}), "/docs/zvonok-settings.json": JSON.stringify({cls: "7Б", ntf: {news: false}})}});
    ok(r.notes.length === 0, "iPhone: уведомления о новостях выключаются");
    ok(r.logs.filter(u => /ping\.json$/.test(u)).length === 1 && JSON.parse(r.files["/docs/zvonok-update.json"]).ping.length === 10, "iPhone: счётчик устройств раз в сутки");
    r = await run({siri: true, versions: {classes: {"7B": ver}}});
    ok(typeof r.out === "string" && r.out.length > 10 && !/undefined|NaN/.test(r.out), "ответ для Siri: «" + r.out + "»");
    // сайт и виджет iPhone считают одно и то же: целая неделя с шагом 7 минут, три класса
    let diff = 0, checks = 0;
    for (const c of ["7Б", "9А", "11Г"]) {
      const res = await run({versions: {classes: {}}}, SCR[c].replace("Script.complete();", "Script.complete(); return d => compute(d, {at: lessonsOn, real: true});"));
      const fn = res.ret, sig = s => [s.kind, s.cur && s.cur.subject, s.next && s.next.subject, s.target == null ? "" : +s.target].join("|");
      for (let t = +new Date("2026-11-02T06:00:00"); t < +new Date("2026-11-09T00:00:00"); t += 7 * 60000) {
        const a = w.compute(new Date(t), {at: d => w.dayLessons(c, d), real: true}), b = fn(new Date(t));
        checks++; if (sig(a) !== sig(b)) diff++;
      }
    }
    ok(diff === 0 && checks > 4000, "сайт и виджет iPhone совпадают в " + checks + " моментах недели" + (diff ? " (расхождений " + diff + ")" : ""));
    // настройки приложения: класс и своё расписание из zvonok-settings.json, параметр виджета важнее
    const probe = code => code.replace("Script.complete();", "Script.complete(); return {CLS, OWN: !!OWN, lessonsOn, freeRooms};");
    const set10 = {"/docs/zvonok-settings.json": JSON.stringify({cls: "10А"})}, tue = new Date("2026-11-10T09:00:00");
    let st = (await run({versions: {classes: {}}, files: set10}, probe(src))).ret;
    ok(st.CLS === "10А" && JSON.stringify(st.lessonsOn(tue).map(l => l.subject + l.room)) === JSON.stringify(w.dayLessons("10А", tue).map(l => l.subject + l.room)),
      "виджет iPhone показывает класс, выбранный в приложении");
    st = (await run({versions: {classes: {}}, files: set10, param: "9а"}, probe(src))).ret;
    ok(st.CLS === "9А" && !st.OWN, "параметр виджета «9а» важнее выбранного в приложении");
    st = (await run({versions: {classes: {}}}, probe(w.personalize(src, {v: 1, days: [[["Шахматы", "12"]]]})))).ret;
    ok(st.OWN && st.lessonsOn(new Date("2026-11-09T09:00:00"))[0].subject === "Шахматы", "своё расписание со страницы iPhone попадает в виджет");
    // виджет «кабинеты»: те же свободные кабинеты, что во вкладке «Кабинеты» на сайте
    st = (await run({versions: {classes: {}}}, probe(src))).ret;
    let roomsDiff = 0;
    for (const [t, n] of [["2026-11-10T10:20:00", 3], ["2026-11-12T08:10:00", 1], ["2026-11-11T13:00:00", 6]]) {
      const d = new Date(t), use = w.roomDay(d), site = w.eval("ROOMS").filter(r => r !== "спортзал" && !(use[r] || []).some(u => u.num === n)).join("  ");
      if (st.freeRooms(d).list !== site) roomsDiff++;
    }
    ok(roomsDiff === 0, "виджет «кабинеты» совпадает с сайтом" + (roomsDiff ? " (расхождений " + roomsDiff + ")" : ""));
  } catch (e) { ok(false, "скрипт iPhone: " + e); }
}

// Сайт внутри приложения Scriptable (?app=scriptable): мост к нему и ничего лишнего на экране
async function embedded() {
  const keep = ["zv.class", "zv.useCustom"].map(k => [k, localStorage.getItem(k)]);
  try {
    const e = await load("_site_under_test.html?app=scriptable", 390, 800), d = e.document;
    ok(d.documentElement.classList.contains("embed") && typeof e.zvNext === "function" && d.getElementById("promo").hidden,
      "сайт в Scriptable: мост на месте, без приглашения поставить сайт");
    e.eval('setClass("8А")');
    const msg = JSON.parse(await new Promise(r => e.zvNext(r)));
    ok(msg.set && msg.set.cls === "8А" && msg.set.useCustom === false, "смена класса в приложении уходит виджетам iPhone");
    e.eval('copyText("проверка")');
    ok(JSON.parse(await new Promise(r => e.zvNext(r))).copy === "проверка", "копирование в приложении через Scriptable");
    ok(JSON.parse(e.zvState()).cls === "8А", "zvState отдаёт выбранный класс");
    localStorage.removeItem("zv.class"); // как при первом запуске: страница ещё не знает класса
    const fresh = await load("_site_under_test.html?app=scriptable&fresh", 390, 800), wasPick = fresh.eval("pick");
    ok(wasPick && fresh.zvSync({cls: "10Б"}) === true && fresh.eval("cls") === "10Б" && fresh.eval("pick") === false && fresh.document.getElementById("hello").hidden,
      "первый запуск в Scriptable: класс виджета подхватывается без перезагрузки страницы");
    e.eval("openLog()");
    ok(d.getElementById("logSheet").open && d.querySelectorAll("#logList .log-item").length === Math.min(4, e.eval("LOG.length")) && e.eval("LOG.length") > 0,
      "«Что нового» открывается листом прямо на главной (без интернета)");
    ok(/^intent:[/][/]danick-dack[.]github[.]io[/]Zvonok[/]8a#Intent;scheme=https;package=app[.]urok7b;/.test(e.eval("appLink()")),
      "«Открыть в приложении» для Android ведёт сразу на класс");
  } catch (x) { ok(false, "сайт в Scriptable: " + x); }
  keep.forEach(([k, v]) => v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v));
}
