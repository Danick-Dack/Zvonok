name: Build APK

on:
  push:
    branches: ['**']   # только ветки: перенос тегов не запускает лишних сборок
    paths-ignore:
      - 'site/**'
      - 'tools/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a   # v4.4.3; сторонние действия закреплены по коммиту
        with:
          gradle-version: '8.7'

      - name: Version
        id: ver
        run: echo "name=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)" >> "$GITHUB_OUTPUT"

      - name: Signing key
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY_B64 }}
          # релиз «Звонка» без ключа был бы подписан другим ключом и не встал бы поверх уже установленного приложения
          MUST_SIGN: ${{ github.repository == 'Danick-Dack/Zvonok' && (github.ref == 'refs/heads/main' || contains(steps.ver.outputs.name, '-beta')) }}
        run: |
          if [ -n "$SIGNING_KEY_B64" ]; then echo "$SIGNING_KEY_B64" | base64 -d > app/zvonok.jks
          elif [ "$MUST_SIGN" = "true" ]; then echo "::error::Нет секрета SIGNING_KEY_B64: релиз без ключа не обновится у людей"; exit 1; fi

      # Android считает день так же, как сайт: эталон снят с site/src/js/rules.js (tools/golden.py)
      - name: Tests
        run: |
          set -o pipefail
          gradle testReleaseUnitTest --no-daemon 2>&1 | tee tests.log || {
            # причина падения сразу в аннотациях сборки, без скачивания логов
            grep -E "error:|FAILED|AssertionError|не совпало|ждали" tests.log | head -20 | sed 's/^/::error::/'; exit 1; }

      - name: Lint
        run: gradle lintDebug --no-daemon   # ошибка lint роняет сборку; предупреждения только в отчёте (lint-report)

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease assembleDebug --no-daemon

      - name: Collect files
        run: |
          cp app/build/outputs/apk/release/app-release.apk Zvonok-165.apk
          cp Zvonok-165.apk Uroki7B.apk   # копия под старым именем: по нему ищет обновление приложение v3.0
          cp site/index.html Zvonok-165.html
          # номер версии для проверки обновлений в приложении; число его скачиваний = сколько телефонов проверяли обновление
          printf '{"tag":"v%s-build-%s"}\n' "${{ steps.ver.outputs.name }}" "${{ github.run_number }}" > version.json
          echo "APK: $(stat -c %s Zvonok-165.apk) байт" >> "$GITHUB_STEP_SUMMARY"
          # описание релиза с контрольной суммой: скачанный APK можно сверить
          cp .github/release-notes.md notes.md
          printf '\n\n**SHA-256** `Zvonok-165.apk`: `%s`\n' "$(sha256sum Zvonok-165.apk | cut -d' ' -f1)" >> notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: Zvonok-165
          path: |
            Zvonok-165.apk
            Zvonok-165.html

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

      - name: Release
        # Релиз только из main (основной) или пробный (-beta) из любой ветки. Сборки -dev в рабочих ветках остаются
        # артефактом: приложение ищет обновление в releases/latest, и незаконченная версия до людей не доберётся.
        if: github.ref == 'refs/heads/main' || contains(steps.ver.outputs.name, '-beta')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65   # v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}-build-${{ github.run_number }}
          name: Звонок v${{ steps.ver.outputs.name }} (сборка ${{ github.run_number }})
          body_path: notes.md
          files: |
            Zvonok-165.apk
            Uroki7B.apk
            Zvonok-165.html
            version.json
          # версия с -beta: пробный выпуск. Приложение обновляется только до основных релизов (releases/latest),
          # и ссылка на сайте ведёт туда же, так что пробную сборку ставит себе только тот, кто проверяет
          prerelease: ${{ contains(steps.ver.outputs.name, '-beta') }}
          make_latest: ${{ !contains(steps.ver.outputs.name, '-beta') }}

  # Снимки экранов на эмуляторе: обе темы, урок, перемена, выходной, крупный шрифт, уведомление.
  # Android 16 (API 36) показывает ещё и таймер урока в строке состояния.
  screens:
    needs: build
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [34, '36.1']   # 36.1: Android 16 QPR, где таймер урока виден чипом в строке состояния
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: debug-apk

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d   # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -timezone Asia/Almaty
          disable-animations: true
          script: bash tools/screens.sh app-debug.apk screens ${{ matrix.api }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-api${{ matrix.api }}
          path: screens/
