name: Site

# Публикует сайт из папки site/ на GitHub Pages (бесплатно).
# Работает, когда репозиторий публичный: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/**'
      - 'ios/**'
      - 'tools/build_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # сайт собирается из data/schedule.json: поменял расписание на GitHub — сайт обновился сам
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Собрать сайт из расписания
        run: |
          pip install qrcode pillow
          python tools/build_site.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
