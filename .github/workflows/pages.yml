name: Site

# Старый адрес danick-dack.github.io/Zvonok: сайт переехал, здесь остаются только данные для старых версий
# приложения и скриптов iPhone (замены, расписание, обновления скриптов) и переадресация на новый адрес.
on:
  push:
    branches: [ci]
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Что собирать
        id: p
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then echo "site=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/ci.json" -o ci.json
          echo "site=$(jq -r .site ci.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.p.outputs.site == 'true'
        with:
          repository: Danick-Dack/Zvonok-src
          ref: main
          ssh-key: ${{ secrets.SRC_KEY }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: steps.p.outputs.site == 'true'
        with:
          python-version: '3.12'

      - name: Собрать сайт из расписания
        if: steps.p.outputs.site == 'true'
        env:
          # закрытый ключ подписи новых версий скрипта iPhone
          IOS_SIGN_KEY: ${{ secrets.IOS_SIGN_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # только чтение счётчика скачиваний релизов этого репозитория
        run: |
          # без ключа виджеты iPhone тихо перестали бы обновляться: они ставят только подписанные версии
          if [ -z "$IOS_SIGN_KEY" ]; then echo "::error::Нет секрета IOS_SIGN_KEY"; exit 1; fi
          pip install -q qrcode pillow
          python tools/build_site.py
          python tools/update_news.py
          python tools/legacy_mirror.py site mirror   # данные и скрипты iPhone остаются, страницы заменены переадресацией

      - uses: actions/configure-pages@v5
        if: steps.p.outputs.site == 'true'
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        if: steps.p.outputs.site == 'true'
        with:
          path: mirror

      - id: deployment
        if: steps.p.outputs.site == 'true'
        uses: actions/deploy-pages@v4
