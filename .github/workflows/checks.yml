name: Checks

on: [push, pull_request, workflow_dispatch]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Данные расписания
        run: python3 tools/check_data.py
      - name: Тесты сайта
        run: python3 tools/test_site.py
      - name: Сборщик новостей на вредном HTML
        run: pip install pillow && python3 tools/test_news.py
      - name: Эталон Android совпадает с правилами сайта
        run: python3 tools/golden.py --check
      - name: Ключ подписи iPhone
        if: github.event_name != 'pull_request'
        env:
          IOS_SIGN_KEY: ${{ secrets.IOS_SIGN_KEY }}
        run: python3 tools/ed25519.py

  # Lighthouse по собранному сайту из этой ветки (PageSpeed проверяет только опубликованный сайт из main)
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lighthouse, телефон и компьютер
        run: |
          # со сжатием, как на GitHub Pages: без него главная в 190 КБ на «медленном 4G» Lighthouse нечестно тормозит
          npx -y serve@14 -l 8080 site >/dev/null 2>&1 &
          sleep 6
          for form in mobile desktop; do
            for page in "index.html?app" about.html iphone.html android.html changelog.html feedback.html make.html; do
              name="lh-$form-${page%%.html*}.json"
              npx -y lighthouse@12 "http://localhost:8080/$page" --quiet --chrome-flags="--headless=new --no-sandbox" \
                $([ "$form" = desktop ] && echo --preset=desktop) --output=json --output-path="$name" || true
            done
          done
          python3 tools/lh_summary.py lh-*.json
